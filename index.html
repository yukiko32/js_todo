<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <title>ToDo List</title>
  <style>
    body {
        background-color: #f8f8ff;
        font-size: 14px;
    }
    </style>
</head>
<body>
  <div class="container text-center" style="max-width: 600px;">
    <!-- Todoアイテム数の表示 -->
    <header class="row my-2 gap-3">
      <span id="js-todo-count" class="col-sm py-1 alert alert-light">全てのタスク: 0</span>
      <span id="js-completed-count" class="col-sm py-1 alert alert-light">完了済み: 0</span>
      <span id="js-incompleted-count" class="col-sm py-1 alert alert-light">未完了: 0</span>
    </header>

    
    <form id="js-form" class="mb-3 row">
      <input
        id="js-form-input"
        type="text"
        placeholder="タスクを追加"
        autocomplete="off"
        class="col-sm me-2 mb-2 form-control form-control-lg"
      />
      <input type="submit" class="col-sm-2 mb-2 btn btn-primary" value="保存">
    </form>
    

    <!-- TodoアプリのメインとなるTodoリスト -->
    <div id="js-todo-list"><!-- Todoリストの表示 --></div>
  </div>


  <script src="./index.js" type="module"></script>
</body>
</html>
